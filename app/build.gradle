plugins {
    id 'com.android.application'
}

android {
    namespace 'com.audiobooster'
    compileSdk 34

    defaultConfig {
        applicationId "com.audiobooster"
        minSdk 29          // Android 10 — mínimo para MediaProjection audio
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Para distribución directa (sideload) no es necesario ofuscar
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
